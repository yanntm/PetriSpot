name: windows build

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [Windows]

jobs:
  build:
    
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v6
    - name: install packages
      run:  C:\msys64\usr\bin\bash -lc "PATH+=:/mingw64/bin ; pacman --noconfirm -S mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-expat"
    - name: configure and build
      run:  C:\msys64\usr\bin\bash -lc "PATH+=:/mingw64/bin ; cd /D/a/PetriSpot/PetriSpot ; cmake -S Petri -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPETRISPOT_LTO=OFF && cmake --build build"
    - name: package zip
      run:  C:\msys64\usr\bin\bash -lc "PATH+=:/mingw64/bin ; cd /D/a/PetriSpot/PetriSpot ; mkdir site ; strip -s build/petri32.exe build/petri64.exe build/petri128.exe ; cp build/petri*.exe site/"
    - name: Upload Artifacts 🔺 # The project is then uploaded as an artifact named 'site'.
      uses: actions/upload-artifact@v6
      with:
        name: site
        path: site/
    
  deploy:
    needs: [build] # The second job must depend on the first one to complete before running, and uses ubuntu-latest instead of windows.

    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Artifacts  # The built project is downloaded into the 'site' folder.
        uses: actions/download-artifact@v7
        with:
          name: site

      - name: move to website
        run: ls -lah ; mkdir -p windows ; cp petri*.exe windows ;  ls -lah windows/
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: Inv-Windows
          folder: windows/ # The deployment folder should match the name of the artifact. Even though our project builds into the 'build' folder the artifact name of 'site' must be placed here.
          clean: true # Automatically remove deleted files from the deploy branch
          single-commit: true 
